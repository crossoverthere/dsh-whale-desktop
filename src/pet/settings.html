<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>看板娘设置</title>
  <link rel="stylesheet" href="/pet/settings.css" />
</head>
<body>
  <h1>看板娘设置</h1>

  <div class="grid">
    <section>
      <h2>看板娘</h2>
      <div class="group" id="group-pet"></div>
    </section>

    <section>
      <h2>窗口与状态</h2>
      <div class="group" id="group-window"></div>
    </section>

    <section>
      <h2>大小与位置</h2>
      <div class="group" id="group-size"></div>
    </section>

    <section>
      <h2>维护</h2>
      <div class="group" id="group-maint"></div>
    </section>
  </div>

  <div class="foot">
    <span id="version"></span>
    <button type="button" id="close">关闭</button>
  </div>

  <script src="/pet/settings.js"></script>
</body>
</html>
