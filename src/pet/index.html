<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!--
    纯本地页面：脚本/样式全部来自 http://127.0.0.1:<port>/assets/*（上游素材原文）。
    connect-src 放行桌宠真正会用的几类端点：
      · 天气：api.open-meteo.com / geocoding-api.open-meteo.com（选填，城市留空则零联网）
      · 余额：默认本机 127.0.0.1:3020，但**接口地址可在设置里改**，
        所以这里必须放行本机任意端口 + https —— 否则自定义地址会被 CSP 直接拦掉
        （表现是"余额不可用"，而且控制台才会说明原因，很难查）。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:;
                 script-src 'self' 'unsafe-inline';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob:;
                 media-src 'self' data: blob:;
                 connect-src 'self' https: http://127.0.0.1:* http://localhost:*;" />
  <title>鲸鱼娘桌宠</title>

  <!-- 上游桌宠样式（不改动） -->
  <link rel="stylesheet" href="/assets/dsh-whale-moe.css" />
  <!-- 壳的覆盖样式：必须在上游样式之后 -->
  <link rel="stylesheet" href="/pet/shell.css" />
</head>
<body>
  <!-- 必须最先：给写死的余额接口装可配置的 fetch 垫片 -->
  <script src="/pet/preshim.js"></script>
  <!-- 上游纯函数状态机，必须先于表现层 -->
  <script src="/assets/whale-moe-core.js"></script>
  <!-- 上游桌宠本体：自己 appendChild 到 body，自己读 localStorage 定位。
       走 /pet/mascot.js 而不是 /assets/…：服务器会在返回前注入一行
       `root.__dshWhaleMoeSay = showLineNow`（磁盘上的 vendor 文件未改），
       这样"本次任务花费"这类动态台词才能主动让她开口。 -->
  <script src="/pet/mascot.js"></script>
  <!-- 壳胶水：点击穿透判定 + 日志回传 -->
  <script src="/pet/shell.js"></script>
</body>
</html>
